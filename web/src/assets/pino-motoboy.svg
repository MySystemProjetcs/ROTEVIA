<svg viewBox="0 0 64 84" xmlns="http://www.w3.org/2000/svg" width="64" height="84">
  <defs>
    <linearGradient id="corpo" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8F88FF"/>
      <stop offset="0.5" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#2E2790"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="disco" cx="0.35" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8E8F3"/>
    </radialGradient>
    <radialGradient id="sombra" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0B1020" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#0B1020" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sombra de contato: é ela que faz o pino parecer pousado sobre o mapa,
       em vez de colado na tela. -->
  <ellipse cx="32" cy="78" rx="14" ry="4.5" fill="url(#sombra)"/>

  <!-- Corpo em gota, com luz vindo de cima à esquerda. -->
  <path d="M32 77C32 77 9 48.5 9 30A23 23 0 1 1 55 30C55 48.5 32 77 32 77Z" fill="url(#corpo)"/>

  <!-- Brilho especular no topo; o disco branco cobre o meio e sobra o aro. -->
  <ellipse cx="32" cy="14" rx="16.5" ry="7.5" fill="url(#brilho)"/>

  <!-- Anel escuro sob o disco: profundidade, o disco parece afundado. -->
  <circle cx="32" cy="29.6" r="14.6" fill="#2E2790" opacity="0.35"/>
  <circle cx="32" cy="29" r="14" fill="url(#disco)"/>

  <g transform="translate(21.50 19.64) scale(0.08203)" fill="#4F46E5">
