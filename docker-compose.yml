services:
  postgres:
    # Imagem da Timescale que já empacota PostGIS e TimescaleDB no mesmo
    # Postgres 16 — atende a stack do CLAUDE.md §3 sem instalar extensão à mão.
    image: timescale/timescaledb-ha:pg16
    container_name: deliveryhub-postgres
    environment:
      POSTGRES_DB: deliveryhub
      POSTGRES_USER: deliveryhub
      POSTGRES_PASSWORD: deliveryhub_dev
      # ICU para ordenação com acento (Ação antes de Acordo). A imagem não tem
      # o locale pt_BR do sistema, mas tem ICU, que é o caminho nativo do PG16.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --locale-provider=icu --icu-locale=pt-BR"
    # pg_stat_statements habilitado desde o dia 1 (ENGINEERING-GUIDE §7): é o
    # que diz a verdade sobre quais queries dominam.
    command:
      - -c
      - shared_preload_libraries=timescaledb,pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/home/postgres/pgdata/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deliveryhub -d deliveryhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: deliveryhub-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
